name: Build Android APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Build APK
        run: |
          flet build apk --project "facebook_clone" --org "com.nishantjlu" --product "Facebook Clone"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facebook-clone-apk
          path: build/apk/*.apk
